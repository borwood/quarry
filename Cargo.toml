[package]
name = "quarry"
version = "0.1.0"
edition = "2021"
description = "Work-graph tool for AI-native development"

[lib]
name = "quarry"
path = "src/lib.rs"

[[bin]]
name = "q"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
time = { version = "0.3", features = ["formatting", "parsing"] }
